# coturn for Nadir Network Communication (Phase 0, single server).
# Install to /etc/turnserver.conf. Replace every CHANGE_ME.

listening-port=3478
tls-listening-port=5349

# Public IP of this server. If the server has a private IP behind 1:1 NAT (most clouds),
# use "external-ip=PUBLIC_IP/PRIVATE_IP".
external-ip=CHANGE_ME_PUBLIC_IP

# Relay ports. Must not overlap the mediasoup WEBRTC_BASE_PORT range.
min-port=49160
max-port=49999

# Short-lived credentials minted by the media node (see media-node/src/turn.ts).
# Must match TURN_SECRET in the media node's .env.
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SECRET
realm=CHANGE_ME_TURN_DOMAIN

# TLS certificate for turns:. With Caddy managing certificates for the same domain, point these at
# Caddy's copies, e.g. /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/<domain>/<domain>.crt
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-multicast-peers
stale-nonce=600
user-quota=12
total-quota=2000

# Never relay into private networks (stops TURN being used to reach internal services).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# The media server itself is reached on its public IP, which stays allowed.
allowed-peer-ip=CHANGE_ME_PUBLIC_IP

log-file=/var/log/turnserver/turnserver.log
simple-log
